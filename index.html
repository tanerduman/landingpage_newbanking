<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AURE — paketsiz ücretsiz hesap. İstersen Standard, Plus veya Premium ekle. Tek uygulamada döviz, kart, birikim ve seyahat."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AURE — Paran her yerde daha güçlü</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('aure-theme')
          if (t !== 'light' && t !== 'dark') t = 'dark'
          document.documentElement.setAttribute('data-theme', t)
          document.documentElement.style.colorScheme = t
        } catch (e) {}
      })()
    </script>
    <style>
      html,
      body,
      #root {
        margin: 0;
        min-height: 100%;
        background: var(--bg, #070708);
        color: var(--text, #f4f1ea);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
